name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The validator depends on `yaml` so it parses frontmatter with the same
      # parser the pack builder uses. A reimplementation drifts, and the drift is
      # invisible: it once passed a skill the builder silently dropped.
      - name: Install dependencies
        run: npm ci
      - name: Validate skills
        run: npm run validate
