name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No dependencies — the validator is dependency-free by design, so there
      # is nothing to install and nothing to keep patched.
      - name: Validate skills
        run: node scripts/validate-skills.mjs
