name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The validator depends on `yaml` so it parses frontmatter with the same
      # parser the pack builder uses. A reimplementation drifts, and the drift is
      # invisible: it once passed a skill the builder silently dropped.
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate skills
        run: npm run validate
      - name: Check for private terms
        run: npm run check:private
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Run skill tests
        run: npm run test:skills
      - name: Test catalog, archive, and evaluation-record contracts
        run: npm run test:distribution
      - name: Build candidate packages and validate host manifests
        run: npm run build:distribution && npm run check:host-manifests

  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Activate the pinned local Claude binary for native plugin tests
        run: node node_modules/@anthropic-ai/claude-code/install.cjs
      - name: Validate and test plugins without production access
        run: npm run test:plugins

  installed-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - name: Pinned installer with isolated homes and foreign working directories
        run: npm run check:installed

  browser-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - name: Install pinned browser tooling
        run: npx --yes --package=agent-browser@0.38.1 agent-browser install --with-deps
      - name: Run browser contracts explicitly, not as skipped Python tests
        run: npx --yes --package=agent-browser@0.38.1 -c 'npm run test:browser'

  # Separate job on purpose. `validate` is hermetic and encodes the builder's
  # rules; this one invokes the real builder over the network, so it can fail
  # when upstream changes rather than when this repository does. Keeping them
  # apart means the two failures are never mistaken for one another.
  builder-agrees:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check the pack builder finds every skill
        run: npm run check:builder
